[package]
name = "speaker"
description = "The speaker adapter: the HAL's DSP init replayed on hifi_misc, the speaker route set on controlC0, a WAV looped on pcmC0D0p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
alarm-core = { path = "../alarm-core" }

[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
