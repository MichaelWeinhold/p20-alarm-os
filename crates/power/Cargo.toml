[package]
name = "power"
description = "The power-off adapter, a CLOCK_POWEROFF_ALARM timer then reboot(2), and the boot-reason adapter over /proc/cmdline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
alarm-core = { path = "../alarm-core" }
pid1 = { path = "../pid1" }

[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
