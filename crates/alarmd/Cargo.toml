[package]
name = "alarmd"
description = "The alarm clock as /init: the time and one alarm on the panel, set by touch, snoozed and dismissed by the side keys, the charge held at its limit, suspended while the panel is off, powered off until the alarm off the cable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
alarm-core = { path = "../alarm-core" }
battery = { path = "../battery" }
clock = { path = "../clock" }
framebuffer = { path = "../framebuffer" }
input = { path = "../input" }
modem = { path = "../modem" }
pid1 = { path = "../pid1" }
power = { path = "../power" }
storage = { path = "../storage" }
suspend = { path = "../suspend" }

[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
