[package]
name = "alarmd"
description = "The alarm clock as /init: the local time on the panel each minute, the charge held at its limit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
alarm-core = { path = "../alarm-core" }
battery = { path = "../battery" }
clock = { path = "../clock" }
framebuffer = { path = "../framebuffer" }
pid1 = { path = "../pid1" }

[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
